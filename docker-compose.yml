# Used by Netrun (persistent SQLite volume).
# Local extras (ports, .env) are in docker-compose.override.yml — Compose merges them automatically on your PC.
services:
  app:
    build: .
    expose: ["8080"]
    volumes:
      - dbdata:/app/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/fitness.db

volumes:
  dbdata:
